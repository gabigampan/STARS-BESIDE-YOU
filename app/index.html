<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Stars Beside You: find the places on Earth where a Moon mission can be tested, each paired with the place on the Moon it matches, and see why. Three missions: rover, solar panels, lunar base." />
    <title>Stars Beside You</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%233b6ea5'/%3E%3Ccircle cx='25' cy='16' r='4' fill='%23c9c6bd'/%3E%3C/svg%3E" />
    <script>window.CESIUM_BASE_URL = './cesium/';</script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Stars Beside You</h1>
      </div>
      <div class="topbar-tools">
        <div class="switches" id="switches" role="group" aria-label="Display and accessibility"></div>
        <button type="button" class="btn" id="keys-button" aria-haspopup="dialog" aria-keyshortcuts="?">Keys</button>
        <button type="button" class="btn" id="credits-button" aria-haspopup="dialog">Data, limits and credits</button>
      </div>
    </header>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <section class="caption" id="guide-caption"></section>

    <main class="stage" id="stage">
      <section class="pane" id="earth-pane" aria-label="Earth globe">
        <div class="globe" id="earth-globe"></div>
        <p class="pane-status" id="earth-status"><span class="spinner" aria-hidden="true"></span><span class="pane-status-text">Loading the Earth…</span></p>
        <div class="pane-caption">
          <h2 class="pane-title">Earth</h2>
          <div class="pane-rule earth-rule" id="earth-rule" hidden></div>
        </div>
        <button type="button" class="btn btn-quiet btn-icon pane-reset" data-reset="earth" aria-label="Reset the Earth view" title="Reset the Earth view"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
      </section>
      <section class="pane" id="moon-pane" aria-label="Moon globe">
        <div class="globe" id="moon-globe"></div>
        <p class="pane-status" id="moon-status"><span class="spinner" aria-hidden="true"></span><span class="pane-status-text">Loading the Moon…</span></p>
        <div class="pane-caption">
          <h2 class="pane-title">Moon</h2>
          <div class="pane-rule moon-rule" id="moon-rule" hidden></div>
        </div>
        <button type="button" class="btn btn-quiet btn-icon pane-reset" data-reset="moon" aria-label="Reset the Moon view" title="Reset the Moon view"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
      </section>

      <aside class="panel panel-mission" id="mission-panel" aria-label="Missions" hidden></aside>
      <aside class="panel panel-detail" id="detail-panel" aria-label="Comparison of the pair" hidden></aside>
      <section class="intro" id="intro" aria-labelledby="intro-title" hidden></section>
    </main>

    <div class="sr-only" id="loading" role="status" aria-live="polite"><span id="loading-error" hidden></span></div>
    <button type="button" class="btn btn-quiet pane-retry" id="loading-retry" hidden>Retry</button>

    <dialog class="credits" id="credits-dialog" aria-labelledby="credits-title">
      <div class="credits-head">
        <h2 id="credits-title">Data, limits and credits</h2>
        <button type="button" class="btn btn-icon" id="credits-close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="credits-body" id="credits-body"></div>
    </dialog>

    <dialog class="credits keys-dialog" id="keys-dialog" aria-labelledby="keys-title">
      <div class="credits-head">
        <h2 id="keys-title">Keyboard shortcuts</h2>
        <button type="button" class="btn btn-icon" id="keys-close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="credits-body" id="keys-body"></div>
    </dialog>

    <p class="sr-only" id="flow-status" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
